services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: payl
      POSTGRES_PASSWORD: payl_dev_only
      POSTGRES_DB: payl
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payl -d payl"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - payl-postgres:/var/lib/postgresql

  postgres-test:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: payl
      POSTGRES_PASSWORD: payl_test_only
      POSTGRES_DB: payl_test
    ports:
      - "127.0.0.1:${PAYL_TEST_DB_PORT:-54330}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payl -d payl_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql

volumes:
  payl-postgres:
