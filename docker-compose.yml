services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: payl
      POSTGRES_PASSWORD: payl_dev_only
      POSTGRES_DB: payl
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payl -d payl"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - payl-postgres:/var/lib/postgresql

volumes:
  payl-postgres:
