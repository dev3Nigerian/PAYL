name: PAYL CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker compose up -d --wait postgres-test
      - run: pnpm typecheck
      - run: pnpm --filter @payl/api test
        env:
          PAYL_TEST_DATABASE_URL: postgresql://payl:payl_test_only@localhost:54330/payl_test
      - run: pnpm build
