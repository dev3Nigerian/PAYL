# Copy these entries into your trusted project or user Codex configuration after deployment.
# Replace the example hostname if you changed the Render service name.

[mcp_servers.payl_wallet]
url = "https://payl-api-dev3nigerian.onrender.com/mcp/wallet"
enabled = true
required = false
tool_timeout_sec = 90
default_tools_approval_mode = "writes"
enabled_tools = [
  "wallet.get_summary",
  "wallet.get_policy",
  "payment.prepare",
  "payment.get_status",
  "payment.cancel",
  "payment.request_refund",
]

[mcp_servers.payl_commerce]
url = "https://payl-api-dev3nigerian.onrender.com/mcp/commerce"
enabled = true
required = false
tool_timeout_sec = 90
default_tools_approval_mode = "writes"
enabled_tools = [
  "commerce.list_merchants",
  "commerce.search_offers",
  "commerce.get_offer",
  "commerce.create_quote",
  "commerce.commit_order",
  "commerce.get_order",
  "commerce.cancel_order",
]
